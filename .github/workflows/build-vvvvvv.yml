name: build-vvvvvv (libXenon ELF32)

# Builds the bare-metal Xbox 360 port with the free60 libXenon toolchain.
# The ELF contains no game assets: users supply their own VVVVVV data/ tree.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull libXenon toolchain image
        run: docker pull free60/libxenon:latest

      - name: Build vvvvvv.elf32
        run: |
          docker run --rm -v "$PWD":/app -w /app free60/libxenon:latest \
            bash -lc 'set -e; echo "DEVKITXENON=$DEVKITXENON"; make -C xenon'

      - name: Verify output is a PowerPC ELF32
        run: python3 ci/verify_elf.py xenon/vvvvvv.elf32

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: vvvvvv-elf32
          path: xenon/vvvvvv.elf32
