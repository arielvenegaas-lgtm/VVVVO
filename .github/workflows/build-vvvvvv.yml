name: build-vvvvvv

# Builds the bare-metal Xbox 360 port with the free60 libXenon toolchain, and
# runs the host (Linux) test suite. The ELF contains no game assets: users
# supply their own VVVVVV data/ tree.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y mtools

      - name: Run host test suite
        run: bash tests/run_host_tests.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull libXenon toolchain image
        run: docker pull free60/libxenon:latest

      - name: Build vvvvvv.elf32
        run: |
          docker run --rm -v "$PWD":/app -w /app free60/libxenon:latest \
            bash -lc 'set -e; echo "DEVKITXENON=$DEVKITXENON"; make -C xenon -j"$(nproc)"'

      - name: Verify output is a PowerPC ELF32
        run: python3 ci/verify_elf.py xenon/vvvvvv.elf32

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: vvvvvv-elf32
          path: xenon/vvvvvv.elf32
